name: app_core
description: App core package

version: 1.1.308

homepage: none
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  async: ^2.6.1
  url_launcher: ^6.0.4
  device_info_plus: ^9.0.3
  package_info_plus: ^8.3.0
  android_id: ^0.3.4
  permission_handler: ^12.0.0+1
  timeago: ^3.1.0
  intl: ^0.18.1
  flutter_secure_storage: ^8.0.0
  json_annotation: ^4.9.0
  fluttertoast: ^8.2.12
  local_auth: ^2.1.6
  new_version_plus: ^0.1.0
  flutter_local_notifications: ^18.0.1
  flutter_slidable: ^3.0.0
  draggable_widget: ^2.0.0

  # Location
  geolocator: 9.0.2
  geocoding: ^2.1.0
  google_maps_flutter: ^2.4.0
  flutter_google_maps_webservices: ^1.1.1
  flutter_google_places_hoc081098: ^2.0.0

  lottie: ^2.6.0

  # Photo picker
  image_picker: ^1.0.4

  # QR code scan
  barcode_scan2: ^4.2.4

  # Firebase
  firebase_core_platform_interface: ^5.4.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  gallery_saver_plus: ^3.2.4
  path_provider: ^2.0.1
  provider: ^6.0.2

  google_fonts: ^6.2.1

  # VoIP
  connectycube_flutter_call_kit: 2.3.0

  # Flutter WebRTC
  flutter_webrtc: 0.13.1+hotfix.1

  flutter_ringtone_player: ^4.0.0+4

  wakelock_plus: ^1.3.2
  uuid: ^4.1.0

  # Vietnamese language parsing
  tiengviet: ^0.5.0

  # QR code generation
  qr_flutter: ^4.1.0

  sliding_up_panel: 2.0.0+1

  confetti: ^0.7.0

  get: ^4.6.3

  get_storage: ^2.0.3

  audioplayers: ^5.1.0

  sb_peerdart: ^0.2.0

  # Text-to-speech
  flutter_tts: ^3.7.0

  # Cache image
  flutter_cache_manager: ^3.3.0
  cached_network_image: ^3.2.2

  flutter_picker_plus: ^1.3.0
  wheel_chooser: ^1.1.2

  xml: ^6.3.0

  avatar_glow: ^2.0.2

  flutter_easyloading: ^3.0.5

  syncfusion_flutter_sliders: ^22.2.10

  slider_captcha: ^1.0.0

  light_compressor: ^2.1.0
  aws_s3_upload_plus: ^1.0.0

  queue: ^3.1.0+2
  socket_io_client: ^2.0.3+1

  internet_connection_checker: ^1.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  lints: ^3.0.0
  source_gen: ^1.5.0
  build_resolvers: ^2.4.2
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  assets:
    - assets/
    - assets/img/
    - assets/json/
    - assets/audio/
    - assets/lingo/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: fonts/BeVietnamPro/BeVietnamPro-Regular.ttf
        - asset: fonts/BeVietnamPro/BeVietnamPro-Bold.ttf
        - asset: fonts/BeVietnamPro/BeVietnamPro-Italic.ttf
          style: italic
    - family: Apercu
      fonts:
        - asset: fonts/ApercuRegular.ttf
        - asset: fonts/ApercuBold.ttf
        - asset: fonts/ApercuItalic.otf
          style: italic
    - family: UberMove
      fonts:
        - asset: fonts/UberMoveMedium.otf
        - asset: fonts/UberMoveBold.otf
